<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amna's Games">
<meta name="theme-color" content="#339af0">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>Monkey Bananas</title>
<link rel="stylesheet" href="../shared/toddler.css">
<style>
  body { background: linear-gradient(#b2f2bb, #8ce99a 50%, #69db7c); }
  .ray { position: absolute; top: 0; width: 10vw; height: 100vh; background: linear-gradient(rgba(255,255,200,.35), transparent 70%); transform: skewX(-10deg); pointer-events: none; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14vh; background: linear-gradient(#2f9e44, #2b8a3e); box-shadow: 0 -8px 0 rgba(255,255,255,.3); }
  .trunk { position: absolute; left: 50%; top: -5vh; width: 7vmin; height: 40vh; transform: translateX(-50%); background: linear-gradient(90deg, #8b5a2b, #a0693b, #6d4420); border-radius: 0 0 3vmin 3vmin; z-index: 0; }
  .leaf { position: absolute; top: 0; width: 34vmin; height: 12vmin; background: linear-gradient(#51cf66, #2f9e44); border-radius: 100% 100% 100% 0; transform-origin: left bottom; box-shadow: inset 0 -1vmin 0 rgba(0,0,0,.12); z-index: 0; animation: leafsway 4s ease-in-out infinite alternate; }
  .leaf.L { border-radius: 100% 100% 0 100%; transform-origin: right bottom; }
  @keyframes leafsway { from { rotate: -3deg } to { rotate: 3deg } }
  .side { position: absolute; bottom: 10vh; font-size: 16vmin; pointer-events: none; z-index: 0; }

  .monkey { position: absolute; left: 50%; bottom: 10vh; width: 30vmin; height: 35.5vmin; transform: translateX(-50%); z-index: 3; }
  .monkey .inner { width: 100%; height: 100%; transform-origin: 50% 100%; filter: drop-shadow(0 10px 8px rgba(0,0,0,.3)); }
  .monkey.hop .inner { animation: hop .6s cubic-bezier(.3,1.5,.6,1); }
  @keyframes hop { 0%{transform:translateY(0)} 40%{transform:translateY(-12vh) rotate(-8deg)} 100%{transform:translateY(0)} }
  .monkey.chew .inner { animation: chew .5s ease-in-out; }
  @keyframes chew { 0%,100%{transform:scale(1)} 30%{transform:scale(1.08,.94)} 60%{transform:scale(.96,1.06)} }
  .monkey.dance .inner { animation: dance 1s ease-in-out; }
  @keyframes dance { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-14deg) translateY(-3vh)} 75%{transform:rotate(14deg) translateY(-3vh)} }

  .banana { position: absolute; left: 0; top: 0; width: 13vmin; height: 13vmin; z-index: 2; will-change: transform; }
  .banana .char { filter: drop-shadow(0 6px 5px rgba(0,0,0,.3)); }
  .banana.eaten { transition: transform .45s cubic-bezier(.4,0,.8,1), opacity .2s .35s; opacity: 0; pointer-events: none; }

  .tally { position: absolute; top: 2vmin; left: 50%; transform: translateX(-50%); display: flex; gap: .5vmin; flex-wrap: wrap; justify-content: center; max-width: 70vw; z-index: 4; pointer-events: none; }
  .tally .char { width: 5vmin; height: 5vmin; }

  .hint { position: absolute; top: 32vh; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 4;
          --c:#fcc419; --c-light:#ffe066; --c-dark:#e67700; --rim:#fff; animation: fade 7s forwards; }
  @keyframes fade { 0%,75% { opacity: 1 } 100% { opacity: 0 } }
</style>
</head>
<body>
  <div class="ray" style="left: 15vw"></div><div class="ray" style="left: 70vw"></div>
  <div class="trunk"></div>
  <div class="leaf" style="left: 50%; transform: rotate(10deg)"></div>
  <div class="leaf" style="left: 50%; top: 6vh; transform: rotate(35deg)"></div>
  <div class="leaf" style="left: 50%; top: 10vh; transform: rotate(60deg); width: 26vmin"></div>
  <div class="leaf L" style="left: calc(50% - 34vmin); transform: rotate(-10deg)"></div>
  <div class="leaf L" style="left: calc(50% - 34vmin); top: 6vh; transform: rotate(-35deg)"></div>
  <div class="leaf L" style="left: calc(50% - 26vmin); top: 10vh; transform: rotate(-60deg); width: 26vmin"></div>
  <div class="side" style="left: 2vw">🌴</div><div class="side" style="right: 2vw">🌴</div>
  <div class="side" style="left: 18vw; font-size: 9vmin">🌺</div><div class="side" style="right: 18vw; font-size: 9vmin">🌺</div>
  <div class="ground"></div>
  <div class="tally" id="tally"></div>
  <div class="monkey" id="monkey"><div class="inner"></div></div>
  <div class="candy hint">Tap the bananas! 🍌</div>

<script src="../shared/toddler.js"></script>
<script src="../shared/characters.js"></script>
<script>
(function () {
  const { S, guardKeys, onPress, addParentBar, rand, pick, burst } = Toddler;
  addParentBar();
  Chars.startBlinking();

  const W = () => innerWidth, H = () => innerHeight;
  const vmin = () => Math.min(W(), H()) / 100;
  const monkey = document.getElementById('monkey');
  const inner = monkey.querySelector('.inner');
  const tally = document.getElementById('tally');
  let mood = 'happy', eaten = 0;
  const setMood = (m) => { mood = m; inner.innerHTML = Chars.monkey('#a0693b', m); };
  setMood('happy');

  const bananas = [];
  function spawn() {
    if (bananas.length >= 7) return;
    const el = document.createElement('div');
    el.className = 'banana';
    el.innerHTML = Chars.banana();
    document.body.appendChild(el);
    const b = { el, x: rand(5 * vmin(), W() - 18 * vmin()), y: -14 * vmin(), vy: rand(.8, 1.6) * vmin() / 8, wob: rand(0, 6.28), rot: rand(-40, 40), landed: false, done: false };
    bananas.push(b);
    el.addEventListener('pointerdown', (e) => { e.stopPropagation(); Toddler.audio(); eat(b); });
  }

  function eat(b) {
    if (b.done) return;
    b.done = true;
    const m = monkey.getBoundingClientRect();
    const tx = m.left + m.width / 2 - 6.5 * vmin(), ty = m.top + m.height * .55 - 6.5 * vmin();
    b.el.classList.add('eaten');
    b.el.style.transform = `translate(${tx}px, ${ty}px) rotate(${b.rot + 360}deg) scale(.5)`;
    setTimeout(() => {
      setMood('eat'); monkey.classList.add('chew'); S.nom();
      burst(tx + 6 * vmin(), ty, ['🍌', '💛', '✨'], 6, 120);
      eaten++;
      const t = document.createElement('div'); t.innerHTML = Chars.banana(); tally.appendChild(t);
      if (tally.children.length > 20) tally.firstChild.remove();
      setTimeout(() => { monkey.classList.remove('chew'); setMood('happy'); if (eaten % 5 === 0) celebrate(); }, 550);
    }, 420);
    setTimeout(() => { b.el.remove(); bananas.splice(bananas.indexOf(b), 1); }, 700);
  }

  function celebrate() {
    monkey.classList.add('dance'); S.monkey(); setTimeout(() => S.chime(), 600);
    const m = monkey.getBoundingClientRect();
    burst(m.left + m.width / 2, m.top, ['🎉', '🍌', '⭐', '💖', '🎊'], 16, 220);
    setTimeout(() => monkey.classList.remove('dance'), 1000);
  }

  function hoot() {
    if (monkey.classList.contains('hop')) return;
    monkey.classList.add('hop'); setMood('wow'); S.monkey();
    const m = monkey.getBoundingClientRect();
    burst(m.left + m.width / 2, m.top, ['💬', '🎵', '🐒'], 6, 140);
    setTimeout(() => { monkey.classList.remove('hop'); setMood('happy'); }, 650);
  }
  monkey.addEventListener('pointerdown', (e) => { e.stopPropagation(); Toddler.audio(); hoot(); });

  function frame() {
    const t = performance.now() / 1000;
    const floor = H() * .86 - 13 * vmin();
    for (const b of bananas) {
      if (b.done) continue;
      if (!b.landed) { b.y += b.vy; if (b.y >= floor) { b.y = floor; b.landed = true; S.pop(); } }
      const sway = b.landed ? 0 : Math.sin(t * 3 + b.wob) * 3 * vmin();
      const bob = b.landed ? Math.abs(Math.sin(t * 3 + b.wob)) * 1.5 * vmin() : 0;
      b.el.style.transform = `translate(${b.x + sway}px, ${b.y - bob}px) rotate(${b.rot + (b.landed ? 0 : Math.sin(t * 2 + b.wob) * 15)}deg)`;
    }
    requestAnimationFrame(frame);
  }
  frame();
  spawn(); setTimeout(spawn, 700); setTimeout(spawn, 1400);
  setInterval(spawn, 2200);

  onPress(document.body, (x, y) => { Chars.lookAt(x, y); burst(x, y, ['🍃', '🌸'], 4, 90); S.bloop(); });
  document.addEventListener('pointermove', (e) => Chars.lookAt(e.clientX, e.clientY), { passive: true });
  guardKeys(() => {
    Toddler.audio();
    const b = bananas.find(b => !b.done);
    if (b) eat(b); else hoot();
  });
})();
</script>
</body>
</html>
